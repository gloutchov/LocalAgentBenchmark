# .github/dependabot.yml — standard gloutchov (proposta 22/11/2026)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7              # per le actions sono supportati solo i default-days
    commit-message:
      prefix: "ci"
      include: "scope"             # -> ci(deps):
    groups:
      github-actions:
        patterns: ["*"]
