name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the supported Pi contract-test version
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile Python sources
        run: python -m compileall -q benchmark.py dashboard.py guided_benchmark.py src cases tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate case manifests and grader calibration
        run: python benchmark.py case validate
      - name: Check required documents
        shell: python
        run: |
          from pathlib import Path
          required = [
              "README.md", "ISTRUZIONI.md", "INSTRUCTIONS.md", "SECURITY_MODEL.md",
              "SECURITY.md", "CONTRIBUTING.md", "PLAN.md", "MAP.md", "AGENTS.md", "LICENSE", "VERSION",
              "QUICK-START_Case-Author.md", "QUICK-START_Showcase.md",
              "QUICK-START_Dashboard.md", "QUICK-START_Guided.md",
              "QUICK-START_LocalProviders.md", "QUICK-START_Windows.md",
              "guided_benchmark.py", "launchers/LocalAgent-Benchmark.command",
              "launchers/LocalAgent-Benchmark.cmd", "launchers/LocalAgent-Benchmark.sh",
              "schemas/case.schema.json", "schemas/dashboard-data.schema.json",
              "site/index.html", "site/404.html", "site/css/styles.css",
              "site/js/app.js", "site/js/i18n.js", "site/js/preferences.js",
              ".github/workflows/pages.yml",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"Missing required documents: {', '.join(missing)}")
